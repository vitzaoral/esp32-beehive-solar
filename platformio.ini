; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Platforma pevně: 6.10.0 = Arduino-ESP32 2.0.17 (stejné jádro jako firmware 3.0.x
; z roku 2025). Novější espressif32 7+/8+ = Arduino 3.x, jiné API a větší binárka.
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; výchozí rozdělení paměti (2x OTA oddíl 1,25 MB); OTA ho změnit nemůže
board_build.partitions = default.csv
lib_deps =
    tinyu-zhao/INA3221@^0.0.1
    blynkkk/Blynk@^1.3.2
    adafruit/Adafruit SHT31 Library@^2.2.2
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ; NimBLE jen jako pozorovatel (pasivní sken), bez rolí, které nepotřebujeme = menší firmware
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Jednotkové testy parseru BLE na počítači: pio test -e native
[env:native]
platform = native
test_build_src = no
lib_ignore = InternetConnection, MeteoData, PowerController, Ina3221Arduino, OtaGuard
